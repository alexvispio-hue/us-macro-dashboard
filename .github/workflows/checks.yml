name: Dashboard checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s src -p 'test_*.py'
      - run: python src/selftest.py
      - run: node src/test_market_ui.cjs
      - run: node src/test_interaction_ui.cjs
      - run: node src/test_research.cjs
